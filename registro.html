<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Banco de Empleos</title>
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/registro.css">
</head>
<body class="auth-screen">

<nav>
  <a href="index.html" class="auth-back">← Inicio</a>
  <a href="index.html" class="logo" aria-label="Ir al inicio">
    <div class="logo-stamp">Emp</div>
    Banco de Empleos
  </a>
  <ul class="nav-links">
    <li><a href="empleos.html">Empleos</a></li>
    <li><a href="index.html#categorias">Categorías</a></li>
    <li><a href="index.html#como-funciona">Cómo funciona</a></li>
    <li><a href="index.html#empresas">Empresas</a></li>
  </ul>
  <div class="nav-actions">
    <a href="index.html" class="btn-outline">Volver</a>
    <a href="login.html" class="nav-cta">Ingresar</a>
  </div>
</nav>

<main>
<header class="hero cork-bg auth-page">
  <div class="hero-inner">
    <span class="hero-eyebrow">Únete a nuestra red</span>
    <div class="auth-card">
      <h1>Registrarse</h1>
      <p class="auth-copy">Crea tu perfil y accede a las mejores vacantes de empresas colombianas. Es rápido y seguro.</p>
      <form>
        <div class="form-field">
          <label for="name">Nombre completo</label>
          <input id="name" type="text" placeholder="Tu nombre completo">
        </div>
        <div class="form-field">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" placeholder="tucorreo@ejemplo.com">
        </div>
        <div class="form-field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" placeholder="Ingresa una contraseña segura">
        </div>
        <div class="form-field">
          <label for="confirm-password">Confirmar contraseña</label>
          <input id="confirm-password" type="password" placeholder="Repite tu contraseña">
        </div>
        <button class="auth-submit" type="submit">Crear cuenta</button>
      </form>
      <div class="auth-footer">
        <p>¿Ya tienes cuenta? <a href="login.html" class="auth-link">Ingresa aquí</a></p>
      </div>
    </div>
  </div>
</header>
</main>
</body>
</html>
